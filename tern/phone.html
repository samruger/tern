<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1b26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>tern</title>
<style>
  :root { --bg: #1a1b26; --fg: #a9b1d6; --text: #c0caf5; --grey: #737aa2; --key: #f7768e; --head: #7aa2f7; --fill: #24283b; --tab: #3b4261;
          --tabtext: #fff; --up: #9ece6a; --dn: #f7768e; --warn: #e0af68; --no: #bb9af7; --value: #c0caf5; --variant: #7dcfff; --page: #7aa2f7;
          --line: color-mix(in srgb, var(--fg) 16%, var(--bg)); --bar: 56px; --safe: env(safe-area-inset-bottom, 0px); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); -webkit-text-size-adjust: 100%; overscroll-behavior-x: none; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 ternmono, "JetBrains Mono", ui-monospace, Menlo, monospace;
         font-variant-ligatures: none; overscroll-behavior: none contain; overflow-x: hidden; }
  button, a { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; text-align: left; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--key); outline-offset: 2px; }
  main { padding: calc(14px + env(safe-area-inset-top, 0px)) 16px calc(var(--bar) + var(--safe) + 24px); max-width: 640px; margin: 0 auto; min-height: 100dvh; }
  h1 { margin: 0 0 14px; font-size: 22px; line-height: 1.2; font-weight: 700; color: var(--page); display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  h1 small { font-size: 14px; font-weight: 400; color: var(--grey); margin-left: auto; }
  h2 { margin: 26px 0 8px; font-size: 16px; font-weight: 700; color: var(--head); display: flex; justify-content: space-between; gap: 12px; }
  h2 span { color: var(--grey); font-weight: 400; font-size: 14px; }
  p { margin: 0 0 8px; }
  .quiet { color: var(--grey); } .small { font-size: 14px; }
  .up { color: var(--up); } .dn { color: var(--dn); } .warn { color: var(--warn); } .no { color: var(--no); } .val { color: var(--value); }
  b, .b { font-weight: 700; }
  .num { text-align: right; white-space: nowrap; }

  /* one line of something, the whole of it to tap */
  .rows { border-top: 1px solid var(--line); }
  .row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 8px 0; border-bottom: 1px solid var(--line); text-decoration: none; }
  .row > .grow { flex: 1; min-width: 0; } .row .sub { font-size: 14px; color: var(--grey); }
  button.row:active, a.row:active { background: var(--fill); }
  .trim { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }

  /* a choice of a few */
  .pick { display: flex; gap: 6px; margin: 0 0 14px; overflow-x: auto; scrollbar-width: none; }
  .pick::-webkit-scrollbar { display: none; }
  .pick button { flex: 1 0 auto; min-height: 44px; padding: 0 12px; text-align: center; background: var(--fill); color: var(--text); border-radius: 6px; white-space: nowrap; }
  .pick button.on { background: var(--page); color: var(--bg); font-weight: 700; }
  .pick button span { display: block; font-size: 13px; line-height: 1.1; }
  .pick.coins button { padding: 6px 12px; line-height: 1.25; }
  .pick button.on span { color: inherit; }
  .pick.mini { gap: 4px; margin: 8px 0 0; overflow: visible; }
  .pick.mini button { position: relative; min-height: 28px; padding: 0 8px; font-size: 14px; line-height: 1; border-radius: 4px; color: var(--grey); }
  .pick.mini button.on { color: var(--bg); }
  .pick.mini button::after { content: ""; position: absolute; inset: -8px -2px; }        /* small to see, not to hit */

  .price { font-size: 34px; line-height: 1.1; font-weight: 700; letter-spacing: -.02em; }
  .line { display: flex; flex-wrap: wrap; gap: 2px 16px; align-items: baseline; }
  figure { margin: 10px 0 0; }
  canvas { display: block; width: 100%; touch-action: pan-y; }
  canvas.tall { height: 220px; } canvas.mid { height: 150px; } canvas.spark { width: 76px; height: 30px; flex: none; }

  dl { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; margin: 12px 0 0; }
  dl div { padding: 7px 0 8px; border-bottom: 1px solid var(--line); min-width: 0; }
  dl.three { grid-template-columns: 1fr 1fr 1fr; }
  dt { color: var(--grey); font-size: 14px; line-height: 1.3; } dd { margin: 0; font-weight: 700; line-height: 1.35; }

  .meter { height: 6px; border-radius: 3px; background: var(--fill); overflow: hidden; margin: 4px 0 10px; }
  .meter i { display: block; height: 100%; background: var(--warn); border-radius: 3px; } .meter.ok i { background: var(--up); }
  .slots { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .slots span { padding: 4px 9px; border-radius: 4px; background: var(--fill); color: var(--grey); font-size: 14px; }
  .slots .done { color: var(--up); } .slots .next { color: var(--bg); background: var(--warn); font-weight: 700; }
  .tag { font-size: 13px; padding: 1px 6px; border-radius: 4px; background: var(--fill); color: var(--grey); white-space: nowrap; }
  .tag.live { background: var(--dn); color: var(--bg); font-weight: 700; } .tag.sel { background: var(--up); color: var(--bg); font-weight: 700; } .tag.pass { color: var(--up); }
  .act { display: flex; align-items: center; justify-content: center; min-height: 50px; width: 100%; margin-top: 18px; border-radius: 6px; background: var(--tab); color: var(--tabtext); font-weight: 700; text-align: center; text-decoration: none; padding: 8px 14px; }
  .act.off { background: var(--fill); color: var(--grey); font-weight: 400; }

  /* the ladder */
  .rung { display: grid; grid-template-columns: 1.2em 5.1em 1fr 6.2em; gap: 8px; align-items: center; width: 100%; min-height: 46px; border-bottom: 1px solid var(--line); }
  .rung .bar { height: 20px; background: var(--fill); border-radius: 0 4px 4px 0; position: relative; }
  .rung .bar i { position: absolute; inset: 0 auto 0 0; border-radius: 0 4px 4px 0; }
  .rung .bar b { position: absolute; right: 5px; top: 0; font-size: 13px; line-height: 20px; color: var(--text); text-shadow: 0 0 3px var(--bg), 0 0 3px var(--bg); }
  .rung .sub { display: block; font-size: 13px; line-height: 1.2; }
  .rung.sel { background: var(--fill); }
  .here { display: flex; align-items: center; gap: 10px; color: var(--key); font-weight: 700; padding: 4px 0; scroll-margin: 40vh; }
  .here::before, .here::after { content: ""; flex: 1; height: 1px; background: var(--key); }
  .sides { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
  .sides div { background: var(--fill); border-radius: 6px; padding: 10px 12px; } .sides b { font-size: 24px; display: block; line-height: 1.2; }
  .nav { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .nav .act { margin-top: 14px; background: var(--fill); color: var(--text); font-weight: 400; }

  /* the log */
  details { border-bottom: 1px solid var(--line); } summary, .entry { display: grid; grid-template-columns: 3.4em 1fr; gap: 8px; padding: 11px 0; list-style: none; }
  summary::-webkit-details-marker { display: none; } .entry { border-bottom: 1px solid var(--line); }
  .entry > div, summary > div { overflow-wrap: anywhere; min-width: 0; } summary > div::after { content: " ▸"; color: var(--key); } details[open] summary > div::after { content: " ▾"; }
  time { color: var(--grey); font-size: 14px; line-height: 23px; }
  .day { color: var(--head); font-weight: 700; padding: 18px 0 6px; border-bottom: 1px solid var(--line); }
  .scroll { overflow-x: auto; margin: 0 0 12px; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }
  table { border-collapse: collapse; font-size: 14px; width: 100%; } th { color: var(--grey); font-weight: 400; } th, td { padding: 6px 6px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--bg); color: var(--variant); padding-left: 0; font-weight: 700; }
  td.note { text-align: left; }
  .ramp { display: flex; height: 18px; width: 96px; border-radius: 4px; overflow: hidden; flex: none; } .ramp i { flex: 1; }

  /* a swipe: the page moves with the finger, and under it is the name of the one it leads to */
  #slide { position: relative; z-index: 1; background: var(--bg); }
  #slide.on { box-shadow: 0 0 0 1px var(--line); will-change: transform; }
  #beside { position: fixed; top: 42%; z-index: 0; max-width: 45vw; font-size: 18px; font-weight: 700; overflow-wrap: anywhere; pointer-events: none; }
  #beside[hidden] { display: none; }

  /* the status line, along the bottom as on the desk, and the menu it opens */
  #bar { position: fixed; inset: auto 0 0 0; z-index: 3; height: calc(var(--bar) + var(--safe)); padding: 0 12px var(--safe) 0; display: flex; align-items: center; gap: 12px;
         background: var(--fill); border-top: 2px solid var(--page); }
  #menub { align-self: stretch; padding: 0 16px; display: flex; align-items: center; gap: 12px; font-weight: 700; min-width: 112px; }
  #menub i { width: 20px; height: 14px; flex: none; border-top: 2px solid var(--key); border-bottom: 2px solid var(--key); position: relative; }
  #menub i::before { content: ""; position: absolute; inset: 4px 0 auto; height: 2px; background: var(--key); }
  @media (max-width: 359px) { #bar .quiet { display: none; } #menub { min-width: 0; } }
  #stat { flex: 1; min-width: 0; text-align: right; white-space: nowrap; overflow: hidden; }
  #mode { padding: 3px 8px; border-radius: 4px; background: var(--up); color: var(--bg); font-weight: 700; font-size: 14px; }
  #mode.armed { background: var(--warn); } #mode.live { background: var(--dn); }
  #menu { position: fixed; inset: 0; z-index: 2; background: var(--bg); overflow-y: auto; overscroll-behavior: contain; padding: calc(14px + env(safe-area-inset-top, 0px)) 16px calc(var(--bar) + var(--safe) + 16px); }
  #menu[hidden] { display: none; }
  #menu .row { min-height: 54px; } #menu .row::before { content: ""; width: 6px; align-self: stretch; border-radius: 3px; background: var(--c, var(--fill)); }
  #menu .row.on .name { color: var(--c); font-weight: 700; }
  #menu .list { max-width: 640px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; justify-content: flex-end; }
  #say { position: fixed; left: 12px; right: 12px; bottom: calc(var(--bar) + var(--safe) + 12px); z-index: 6; padding: 10px 14px; border-radius: 6px; background: var(--warn); color: var(--bg); font-weight: 700; }
  #say[hidden] { display: none; }
  .alert { background: var(--fill); border-left: 4px solid var(--warn); padding: 10px 12px; margin: 0 0 14px; border-radius: 0 6px 6px 0; color: var(--warn); } .alert.bad { border-color: var(--dn); color: var(--dn); }
  @media (prefers-reduced-motion: no-preference) { #menu:not([hidden]), #sheet:not([hidden]) .box { animation: rise .16s ease-out; } @keyframes rise { from { transform: translateY(24px); opacity: 0; } } }

  /* the settings and the help */
  details.set summary { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 0; } details.set summary > .grow { flex: 1; min-width: 0; }
  details.set summary::after { content: "▸"; color: var(--key); } details.set[open] summary::after { content: "▾"; }
  .about { padding: 0 0 10px; } .about p { font-size: 14px; color: var(--fg); margin: 0 0 6px; } .about .head { color: var(--head); font-weight: 700; } .about .fact { color: var(--value); }
  .row .pick { width: 100%; flex-wrap: wrap; margin: 0 0 4px; } .help p { margin: 0 0 10px; } .help .item { padding-left: 1.4em; text-indent: -1.4em; margin: 0 0 6px; }

  /* the app's own: its controls, and the questions they ask, as the desk's boxes ask them, along the bottom */
  .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; } .tools .act { margin-top: 10px; background: var(--fill); color: var(--text); font-weight: 400; }
  .tools .act.off { color: var(--grey); }
  .act.red { background: var(--dn); color: var(--bg); } .act.no { background: var(--bg); color: var(--text); font-weight: 400; }
  .draft { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 4px 0 0; }
  #sheet { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; justify-content: flex-end; background: color-mix(in srgb, var(--bg) 55%, transparent); }
  #sheet[hidden] { display: none; }
  #sheet .box { width: 100%; max-width: 640px; margin: 0 auto; max-height: 88dvh; overflow-y: auto; overscroll-behavior: contain; background: var(--fill);
                border-top: 2px solid var(--c); border-radius: 8px 8px 0 0; padding: 16px 16px calc(16px + var(--safe)); }
  #sheet h2 { margin: 0 0 10px; color: var(--c); } #sheet p.in { padding-left: 1em; } #sheet p.gap { height: 2px; }
  #sheet .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } #sheet .two .act { margin-top: 14px; }
  #sheet .pick { margin: 12px 0 4px; flex-wrap: wrap; } #sheet .pick button { flex: 1 0 auto; background: var(--bg); } #sheet .pick button.on { background: var(--c); }
  #sheet input { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; min-height: 48px; padding: 0 12px; width: 100%; margin-top: 10px; }
  #sheet input:focus { outline: 2px solid var(--c); outline-offset: 0; }
  .step { display: grid; grid-template-columns: 52px 1fr 52px; gap: 8px; margin: 12px 0 4px; }
  .step button { min-height: 48px; border-radius: 6px; background: var(--bg); color: var(--key); font-weight: 700; font-size: 22px; text-align: center; }
  #sheet .step input { margin: 0; text-align: center; font-weight: 700; }
</style>
</head>
<body>
<div id="beside" aria-hidden="true" hidden></div>
<div id="slide"><main id="main" aria-live="off"></main></div>
<nav id="menu" aria-label="Pages" hidden></nav>
<div id="say" role="status" hidden></div>
<div id="bar"><button id="menub" aria-expanded="false" aria-controls="menu"><i aria-hidden="true"></i><span id="where">menu</span></button>
  <span id="stat"></span><span id="mode" hidden></span></div>
<noscript>tern needs JavaScript here.</noscript>
<script>
"use strict";
(async function () {
  const $ = id => document.getElementById(id);
  const main = $("main"), menu = $("menu");
  const res = await fetch("/look");
  if (res.status === 401) { location.href = "/login"; return; }
  const look = await res.json();

  // ------------------------------------------------------------ colors: foot's 16, then xterm's 256, by the theme's roles
  const pal = look.base.slice(), lv = [0, 95, 135, 175, 215, 255];
  const hex = (...v) => "#" + v.map(x => Math.round(x).toString(16).padStart(2, "0")).join("");
  for (let n = 0; n < 216; n++) pal.push(hex(lv[Math.floor(n / 36)], lv[Math.floor(n / 6) % 6], lv[n % 6]));
  for (let i = 0; i < 24; i++) pal.push(hex(8 + 10 * i, 8 + 10 * i, 8 + 10 * i));
  const root = document.documentElement.style, css = (k, v) => root.setProperty("--" + k, v);
  css("bg", look.bg); css("fg", look.fg);
  document.querySelector("meta[name=theme-color]").content = look.bg;
  let theme = null;
  function dress(t) {
    theme = t;
    for (const k of ["text", "grey", "key", "head", "fill", "tab", "up", "dn", "warn", "no", "value", "variant"]) css(k, pal[t[k]]);
    css("tabtext", pal[t.tab_text]);
  }
  const PAGE = { contract: "contract", variant: "variants", edit: "variants", report: "reports", home: "spot" };     // whose color a page has
  const pageColor = p => pal[theme.border[PAGE[p] || p]];

  // ------------------------------------------------------------ elements: made anew each time, and morphed onto what is there
  function el(spec, ...kids) {
    let attrs = {};
    if (kids.length && kids[0] && typeof kids[0] === "object" && !kids[0].nodeType && !Array.isArray(kids[0])) attrs = kids.shift();
    const [tag, ...cls] = spec.split("."), n = document.createElement(tag);
    if (cls.length) n.className = cls.join(" ");
    for (const [k, v] of Object.entries(attrs)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === "style") for (const [p, x] of Object.entries(v)) n.style.setProperty(p, x);
      else if (k === "cls") v && n.classList.add(...String(v).split(" ").filter(Boolean));
      else n.setAttribute(k, v === true ? "" : v);
    }
    const add = c => Array.isArray(c) ? c.forEach(add) : c !== null && c !== undefined && c !== false && c !== "" && n.append(c.nodeType ? c : String(c));
    kids.forEach(add);
    return n;
  }
  const keep = new Set(["open", "width", "height"]);
  function morph(a, b) {
    if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName) { a.replaceWith(b); return; }
    if (a.nodeType === 3) { if (a.data !== b.data) a.data = b.data; return; }
    for (const { name } of [...a.attributes]) if (!b.hasAttribute(name) && !(keep.has(name) && /CANVAS|DETAILS/.test(a.nodeName))) a.removeAttribute(name);
    for (const { name, value } of [...b.attributes]) if (a.getAttribute(name) !== value) a.setAttribute(name, value);
    const keyed = new Map([...a.childNodes].filter(c => c.dataset && c.dataset.k).map(c => [c.dataset.k, c]));
    let ref = a.firstChild;
    for (const n of [...b.childNodes]) {
      const k = n.dataset && n.dataset.k;
      let m = k ? keyed.get(k) : ref && !(ref.dataset && ref.dataset.k) ? ref : null;
      if (k) keyed.delete(k);
      if (!m) { a.insertBefore(n, ref); continue; }
      if (m === ref) ref = ref.nextSibling; else a.insertBefore(m, ref);
      morph(m, n);
    }
    while (ref) { const next = ref.nextSibling; ref.remove(); ref = next; }
  }
  const paint = pieces => pieces.map(([t, c, b]) => el(b ? "b" : "span", { style: c >= 0 ? { color: pal[c] } : {} }, t));
  const pct = v => (v >= 0 ? "▲ +" : "▼ −") + Math.abs(v * 100).toFixed(2) + "%";
  const usd = (v, sign) => (v < 0 ? "-" : sign ? "+" : "") + "$" + Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const price = v => v >= 1000 ? Math.round(v).toLocaleString("en-US") : v >= 10 ? v.toFixed(2) : v >= 1 ? v.toFixed(3) : v.toFixed(4);
  const role = v => v >= 0 ? "up" : "dn";

  let swipe = null;                                         // the finger on the page, while it may be a swipe
  // ------------------------------------------------------------ charts: tern's dots, colored by height
  const charts = new Map(), held = new Map();              // canvas id -> its chart; -> where a finger is, 0..1
  function chart(id, size, c, label) {
    charts.set(id, c);
    return el("figure", {}, el("canvas." + size, { "data-chart": id, role: "img", "aria-label": label }));
  }
  function spark(id, vals) {
    charts.set(id, { vals, small: true, grad: theme.grads[vals.length && vals[vals.length - 1] >= 0 ? "eq_up" : "eq_dn"] });
    return el("canvas.spark", { "data-chart": id, role: "img", "aria-label": "P&L by hour" });
  }
  const clock = t => new Date(t * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
  function draw(cv) {
    const c = charts.get(cv.dataset.chart), dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
    if (!c || !W || !H) return;
    if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
    const x = cv.getContext("2d");
    x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, W, H);
    const v = c.vals, pitch = c.small ? 3 : 4, dot = c.small ? 2 : 2.6, foot = c.small ? 0 : 22, top = c.small ? 0 : 20, h = H - foot - top;
    const font = getComputedStyle(document.body).fontFamily;
    x.font = `13px ${font}`;
    if (v.length < 2) { if (!c.small) { x.fillStyle = pal[theme.grey]; x.fillText(c.none || "no data yet", 0, H / 2); } return; }
    let lo = c.lo, hi = c.hi;
    if (lo === undefined) {
      lo = Math.min(...v); hi = Math.max(...v);
      for (const m of c.marks || []) if (m.fit && Math.abs(m.v - (lo + hi) / 2) < 3 * (hi - lo || 1)) { lo = Math.min(lo, m.v); hi = Math.max(hi, m.v); }
      const p = (hi - lo) * 0.08 || Math.abs(hi) * 0.0005 || 1; lo -= p; hi += p;
    }
    const gut = c.small ? 0 : Math.ceil(Math.max(...[lo, hi].map(y => x.measureText(c.fmt(y)).width)) + 8), w = W - gut;
    const cols = Math.max(2, Math.floor(w / pitch)), rows = Math.max(2, Math.floor(h / pitch)), Y = y => top + (hi - y) / (hi - lo) * h;
    const at = k => v[Math.min(v.length - 1, Math.floor(k * v.length / cols))];
    const base = lo < 0 && hi > 0 && c.zero ? 0 : lo, g = c.grad;
    const peak = Math.max(...v), span = Math.max(1e-12, peak - lo);
    for (let i = 0; i < cols; i++) {
      const a = at(i), y0 = Math.min(a, base), y1 = Math.max(a, base);
      for (let r = 0; r < rows; r++) {
        const y = hi - (r + 0.5) / rows * (hi - lo);
        if (y < y0 || y > y1) continue;
        x.fillStyle = pal[g[Math.max(0, Math.min(g.length - 1, Math.round((y - lo) / span * (g.length - 1))))]];
        x.globalAlpha = 0.35 + 0.65 * Math.min(1, (y - lo) / span); x.fillRect(i * pitch, top + r * pitch + (h - rows * pitch) / 2, dot, dot);
      }
    }
    x.globalAlpha = 1;
    x.beginPath(); x.lineWidth = c.small ? 1.5 : 2; x.lineJoin = "round"; x.strokeStyle = pal[g[g.length - 1]];
    for (let i = 0; i < cols; i++) x[i ? "lineTo" : "moveTo"](i * pitch + dot / 2, Y(at(i)));
    x.stroke();
    if (c.small) return;

  // ------------------------------------------------------------ the app's controls: the paired app's, and no one else's
  // tern web says "control" to the paired app's own session alone, and only the app has TernApp, its keys; the desk checks

  // only through controls(). A command is signed on the phone (a fingerprint for live), then sent to /act as it came.
  const CONTROLS = (() => {
    const NAME_MAX = 12;                                    // a variant's name (variants.NAME_MAX)
    const ENGINE = new Set(["live", "variant_new", "rename", "variant_delete", "variant_on", "set"]);     // what the engine answers
    const waiting = new Map(), heard = new Map(), drafts = new Map();       // asked to be signed; sent, until the engine answers; a variant's draft
    let asked = null, signs = 0, sheet = null;
    const typedLive = t => t.trim().toLowerCase() === "live";
    const armed = () => last.mode !== "paper";
    const coin = s => ((last.coins || []).find(c => c.series === s) || {}).coin || s;
    const g = v => String(+(+v).toPrecision(6));
    const same = (a, b) => Array.isArray(a) && Array.isArray(b) ? JSON.stringify([...a].sort()) === JSON.stringify([...b].sort()) : a === b;
    function fmt(r, v) {                                    // as the screen shows it (Screen.set_fmt)

      if (r.kind === "bool") return v ? "on" : "off";
      if (r.kind === "p") return Math.round(v * 100) + "¢";
      if (r.kind === "slots") return v.join(" ");
      if (r.kind === "coins") return v.map(coin).join(" ");
      if (r.kind === "n") return g(v);

    const decimals = r => r.kind === "p" || r.kind === "usd" ? 2 : r.kind === "cap" && r.key !== "rule.cap" ? 1 : 0;
    const snap = (r, v) => +Math.max(r.lo, Math.min(r.hi, Math.round(v / r.step) * r.step)).toFixed(decimals(r));

    // ---- sending: signed by the app, then to /act; what the desk says, then what the engine answers, in the say line
    function act(cmd, live, then) {

        ans = await fetch("/act", { method: "POST", headers: { "Content-Type": "application/json" }, body });

    window.ternRefused = (id, text) => { if (waiting.delete(id)) say(text || "not sent"); };
    function follow(moved) {                                // drafts under a variant's old name, to its new one

    // ---- the question: words, maybe a value to set or a word to type, and no / yes

    function draw() {

    // ---- a value: a stepper (or type one), on / off, or a few of several
    function editor(r, v) {

    // ---- a variant: on / off, edit, rename, delete, live

  })();
  const controls = () => last && last.control && window.TernApp && TernApp.paired() ? CONTROLS : null;
  // ------------------------------------------------------------ (the controls end here)

  // ------------------------------------------------------------ the menu and the status line
  const NAMES = ["home", "ladder", "book", "variants", "log", "gate", "reports", "settings", "themes", "help"];
  const route = () => { const [p, ...a] = location.hash.replace(/^#\/?/, "").split("/"); let arg = a.join("/"); try { arg = decodeURIComponent(arg); } catch (e) {} return { page: PAGES[p] ? p : "home", arg: arg || null }; };

  let open = false, last = null;
  function drawMenu() {
    const at = parent(route().page), m = (last || {}).menu || {}, coin = last && last.coins.find(c => c.series === last.series);
    const facts = { ...m, home: coin ? [`${coin.coin} $${coin.px}`, ""] : ["", ""] };
    const list = el("div.list", {}, NAMES.map(n => el("a.row", { href: "#/" + n, cls: n === at ? "on" : "", "aria-current": n === at ? "page" : null, style: { "--c": pageColor(n) } }, el("span.grow.name", {}, n), facts[n] && el("span", { cls: facts[n][1] || "quiet" }, facts[n][0]))),
      el("a.row", { href: "/ui/full" }, el("span.grow.name", {}, "full screen"), el("span.quiet", {}, "the desk's layout")), look.login && el("a.row", { href: "/logout" }, el("span.grow.name", {}, "sign out")));

    if (on) { if (theme) drawMenu(); menu.scrollTop = 0; }
    bar();
  }
  $("menub").addEventListener("click", () => { if (open) history.back(); else { history.pushState({ menu: 1 }, ""); showMenu(true); } });   // the phone's back closes it
  window.addEventListener("popstate", () => showMenu(!!(history.state && history.state.menu)));
  menu.addEventListener("click", e => {
    const a = e.target.closest("a[href^='#']");
    if (!a) return;
    e.preventDefault(); showMenu(false);
    history.replaceState(null, "", a.getAttribute("href")); moved();                          // in the menu's own place in the history
  });
  function bar() {
    $("where").textContent = open ? "close" : parent(route().page);
    if (!last || !theme) return;
    const c = last.coins.find(x => x.series === last.series), m = $("mode");
    morph($("stat"), el("span", { id: "stat" }, c && [el("span.quiet", {}, c.coin + " "), el("b", {}, "$" + c.px)]));
    m.hidden = false; m.textContent = last.mode === "live" ? "LIVE" : last.mode === "armed" ? "ARMED" : "PAPER"; m.className = last.mode;
  }

  // ------------------------------------------------------------ talking to tern web
  const store = (k, v) => { try { return v === undefined ? localStorage.getItem(k) : localStorage.setItem(k, v); } catch (e) { return null; } };
  let sid = null; try { sid = sessionStorage.getItem("tern-sid"); } catch (e) {}
  const prefs = () => { try { return JSON.parse(store("tern-prefs") || "null"); } catch (e) { return null; } };
  let data = null, shown = "", view = null, busy = false, again = null, fails = 0, lastAt = 0, sayT = 0, etag = null;
  const EVERY = { log: 3000, gate: 3000, reports: 4000, report: 3000, themes: 6000, variants: 2000, settings: 2000, edit: 2000, help: 6000 };
  function say(t) { $("say").textContent = t; $("say").hidden = false; clearTimeout(sayT); sayT = setTimeout(() => { $("say").hidden = true; }, 4000); }
  async function get(set) {
    if (busy) { again = { ...(again || {}), ...(set || {}) }; return; }
    busy = true;
    try {
      do {
        const r = route(), send = { ...(again || {}), ...(set || {}) };
        let key = r.page + "/" + r.arg;
        again = set = null;
        const { view: v, ...picked } = send;
        if (v) view = v; else if (picked.variant) view = null;
        const body = { sid, prefs: prefs(), page: r.page, arg: r.arg, view, look: theme && theme.name, etag: key === shown ? etag : null };
        if (Object.keys(picked).length) body.set = picked;
        const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 10000);
        let ans;
        try { ans = await fetch("/phone", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body), signal: ctl.signal }); } finally { clearTimeout(t); }
        if (ans.status === 401) { location.href = "/login"; return; }
        if (!ans.ok) throw new Error(ans.status);
        const d = await ans.json();
        sid = d.sid; try { sessionStorage.setItem("tern-sid", sid); } catch (e) {}
        store("tern-prefs", JSON.stringify(d.prefs));
        if (d.look) dress(d.look);
        fails = 0; lastAt = Date.now(); last = d;
        if (controls() && d.results) controls().hear(d.results);                      // the engine's answers to what this app sent
        if (controls() && d.renamed) controls().follow(d.renamed);                    // (a draft goes with its variant's new name)
        if (leaving) await leaving;
        const now = route();
        if (now.page + "/" + now.arg !== key) { again = again || {}; continue; }          // moved on meanwhile
        const to = d.data && r.arg && (r.page === "variant" ? d.data.name : r.page === "edit" ? d.data.from : null);
        if (to && to !== r.arg) {                                                     // one of your own, renamed: its page goes with it
          key = r.page + "/" + to; history.replaceState(history.state, "", `#/${r.page}/` + encodeURIComponent(to));
          if (back.y.has(shown)) back.y.set(key, back.y.get(shown));
          if (shown === r.page + "/" + r.arg) shown = key;                           // (the same page, under its new name)
        }
        if (d.data) { data = d.data; etag = d.etag; }
        render(key);
      } while (again);
    } catch (e) {
      if (++fails > 1) render(shown);
    } finally { busy = false; arrive(); }
  }
  function alerts() {
    const out = [];
    if (fails > 1) out.push(el("div.alert.bad", { "data-k": "lost" }, "No answer from tern" + (lastAt ? ` since ${clock(lastAt / 1000)}.` : ".") + " Trying again."));
    else if (last && !last.engine.ok) out.push(el("div.alert.bad", { "data-k": "eng" }, last.engine.text[0].toUpperCase() + last.engine.text.slice(1) + "."));
    else if (last && last.engine.text) out.push(el("div.alert", { "data-k": "old" }, last.engine.text));
    if (last && last.error) out.push(el("div.alert.bad", { "data-k": "err" }, "Live: " + last.error));
    return out;
  }
  function render(key) {
    if (swipe && swipe.on) return;                         // not under a moving finger: the next answer draws it
    if (!theme || !data || !last) { if (fails > 1) morph(main, el("main", { id: "main", "aria-live": "off" }, alerts())); return; }
    const p = last.page, fresh = key !== shown;
    css("page", pageColor(p));
    charts.clear();
    const el2 = el("main", { id: "main", "aria-live": "off" }, alerts(), PAGES[p](last, data));
    if (fresh) main.replaceChildren();
    morph(main, el2);
    shown = key;
    document.title = p === "home" ? "tern" : `${p} · tern`;
    if (last.flash && last.flash !== render.flash) say(last.flash);
    render.flash = last.flash;
    if (fresh) {
      const y = back.y && back.y.get(key); window.scrollTo(0, 0);
      const here = p === "ladder" && $("here");
      if (y && !here) window.scrollTo(0, y); else if (here) here.scrollIntoView({ block: "center" });
    }
    drawAll(); bar(); if (open) drawMenu();
  }
  back.y = new Map();                                      // where each page was scrolled to, for coming back to it
  window.addEventListener("scroll", () => { if (shown && !open) { const r = route(); if (r.page + "/" + r.arg === shown) back.y.set(shown, window.scrollY); } }, { passive: true });
  function moved() { showMenu(false); etag = null; bar(); get(); }
  window.addEventListener("hashchange", moved);
  main.addEventListener("click", e => {
    const a = e.target.closest("a[data-swap]");
    if (a) { e.preventDefault(); history.replaceState(null, "", a.getAttribute("href")); moved(); return; }       // strike to strike: one step back to the ladder
    const b = e.target.closest("[data-set]");
    if (!b) return;
    const k = b.dataset.set, v = b.dataset.v;
    if (k === "sort") { sort = v; render(shown); return; }
    get({ [k]: v });
  });
  window.addEventListener("resize", drawAll);

  // ------------------------------------------------------------ swiping: the menu's pages in order and around, so the variants and the reports; the strikes have ends
  const slide = $("slide"), beside = $("beside"), calm = window.matchMedia("(prefers-reduced-motion: reduce)");
  function next(step) {
    const { page, arg } = route(), i = NAMES.indexOf(page);
    if (i >= 0) { const n = NAMES[(i + step + NAMES.length) % NAMES.length]; return { to: "#/" + n, name: n, color: pageColor(n) }; }
    if (!data || shown !== page + "/" + arg || data.none) return null;
    const color = pageColor(page), swap = true;
    if (page === "contract") { const t = step > 0 ? data.up : data.down; return t ? { to: "#/contract/" + t, name: step > 0 ? "higher strike" : "lower strike", color, swap } : null; }
    const all = new Map(data.all), at = page === "variant" ? data.name : data.id;
    const ids = page === "variant" && order ? order().filter(n => all.has(n)) : [...all.keys()], k = ids.indexOf(at), id = k < 0 || ids.length < 2 ? undefined : ids[(k + step + ids.length) % ids.length];
    return id === undefined ? null : { to: `#/${page}/` + encodeURIComponent(id), name: all.get(id), color, swap };
  }
  let leaving = null, away = 0, awayT = 0;                  // until the old page is off the screen; which way it went, until the new one is drawn
  const move = (x, ms, o) => { slide.style.transition = ms && !calm.matches ? `transform ${ms}ms ease-out, opacity ${ms}ms ease-out` : "none"; slide.style.transform = x ? `translateX(${x}px)` : ""; slide.style.opacity = o === undefined ? "" : o; };
  const rest = () => { slide.classList.remove("on"); beside.hidden = true; };
  function arrive() {                                       // the new page comes in from the side the old one left towards it
    if (!away) return;
    clearTimeout(awayT);
    const from = away; away = 0; rest();
    if (calm.matches) { move(0); return; }
    move(from * 60, 0, 0); slide.getBoundingClientRect(); move(0, 180);
  }
  function leave(step, to) {
    const W = window.innerWidth;
    move(-step * W, 140);
    away = step; clearTimeout(awayT); awayT = setTimeout(arrive, 1500);                       // a slow answer: the page is put back meanwhile
    const p = leaving = new Promise(r => setTimeout(() => { if (leaving === p) leaving = null; r(); }, calm.matches ? 0 : 140));
    if (to.swap) { history.replaceState(null, "", to.to); moved(); } else location.hash = to.to;
  }
  const EDGE = 24;                                          // the phone's own back swipe starts here
  main.addEventListener("touchstart", e => {
    const t = e.touches[0], vv = window.visualViewport, sel = window.getSelection();
    if (swipe && swipe.on) move(0, 160);
    swipe = null;
    if (!away) rest();
    if (e.touches.length !== 1 || open || away || !theme || (vv && vv.scale > 1.02) || (sel && sel.type === "Range")) return;
    if (t.clientX < EDGE || t.clientX > window.innerWidth - EDGE) return;
    for (let n = e.target; n && n !== main; n = n.parentNode) if (n.matches && n.matches(".pick, .scroll") && n.scrollWidth > n.clientWidth + 1) return;       // that slides by itself
    const chart = e.target.closest && e.target.closest("canvas[data-chart]:not(.spark)");
    swipe = { x: t.clientX, y: t.clientY, at: e.timeStamp, dx: 0, chart, on: false, trail: [] };
  }, { passive: true });
  main.addEventListener("touchmove", e => {
    if (!swipe) return;
    const t = e.touches[0], dx = t.clientX - swipe.x, dy = t.clientY - swipe.y;
    if (!swipe.on) {
      if (swipe.chart && e.timeStamp - swipe.at > 220) { swipe = null; return; }              // held first: the chart is being read
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      if (Math.abs(dx) < 1.3 * Math.abs(dy) || !e.cancelable) { swipe = null; return; }       // the page is being scrolled
      swipe.on = true; swipe.to = {}; slide.classList.add("on");
      if (held.size) { held.clear(); drawAll(); }
    }
    e.preventDefault();
    swipe.trail.push([e.timeStamp, dx]);
    while (swipe.trail.length > 2 && e.timeStamp - swipe.trail[0][0] > 100) swipe.trail.shift();
    const step = dx < 0 ? 1 : -1, to = step in swipe.to ? swipe.to[step] : swipe.to[step] = next(step);
    swipe.dx = dx; swipe.step = step;
    move(to ? dx : dx / 4);                                 // nothing that way: it gives a little
    beside.hidden = !to;
    if (to) {
      beside.textContent = step > 0 ? to.name + " ›" : "‹ " + to.name;
      beside.style.color = to.color; beside.style.textAlign = step > 0 ? "right" : "left";
      beside.style.left = step > 0 ? "auto" : "16px"; beside.style.right = step > 0 ? "16px" : "auto";
      beside.style.opacity = Math.min(1, 0.25 + Math.abs(dx) / reach());
    }
  }, { passive: false });
  const reach = () => Math.max(64, window.innerWidth * 0.24);
  function lift(e) {
    const s = swipe;
    swipe = null;
    if (!s || !s.on) return;
    const to = s.to[s.step], [t0, x0] = s.trail[0], [t1, x1] = s.trail[s.trail.length - 1], speed = (x1 - x0) / Math.max(1, t1 - t0) * -s.step;
    const still = e.timeStamp - t1 > 120;
    if (e.type === "touchend" && to && speed > -0.2 && (Math.abs(s.dx) > reach() || (!still && Math.abs(s.dx) > 30 && speed > 0.35))) { leave(s.step, to); return; }
    move(0, 160); setTimeout(() => { if (!swipe && !away) rest(); }, 160);
  }
  main.addEventListener("touchend", lift); main.addEventListener("touchcancel", lift);

  // the font foot uses, served by tern web
  (async () => {
    try {
      for (const [style, weight] of [["regular", "400"], ["bold", "700"]]) if (look.fonts.includes(style)) document.fonts.add(await new FontFace("ternmono", `url(/font/${style})`, { weight }).load());
      drawAll();
    } catch (e) { /* the phone's own */ }
  })();
  if (history.state && (history.state.menu || history.state.sheet)) history.replaceState(null, "");
  await get();
  let due = 0;
  setInterval(() => {
    if (document.hidden || busy || Date.now() < due) return;
    due = Date.now() + (fails ? Math.min(10000, 1000 * 2 ** fails) : data && data.ready === false ? 500 : EVERY[route().page] || 1000);
    get();
  }, 250);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { due = 0; get(); } });
})();
</script>
</body>
</html>
